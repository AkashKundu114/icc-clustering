[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "icc"
version = "2.2.0"
description = "Invariant Core Consensus: Feature-Gated Bipartite Graph Ensembles for Stable Clustering in High-Dimensional Regimes"
readme = "README.md"
authors = [
    {name = "Akash Kundu", email = "akashkundu1152@gmail.com"}
]
license = {text = "MIT"}
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.23.0",
    "scipy>=1.10.0",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
    "scikit-learn>=1.3.0",
    "seaborn>=0.12.0",
    "pyyaml>=6.0",
    "tqdm>=4.60.0",
    "tabulate>=0.9.0",
    "reportlab>=4.0.0",
    "Pillow>=9.5.0",
]

[project.optional-dependencies]
# Deep clustering baselines (DEC, IDEC, SCAN, Contrastive Clustering)
deep = [
    "torch>=2.0.0",
    "tensorflow>=2.12.0",
    "keras>=3.0.0",
]
# Single-cell RNA-seq datasets and processing
bio = [
    "scanpy>=1.9.0",
    "anndata>=0.9.0",
]
# Development, testing, and linting
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black",
    "ruff",
    "mypy>=1.0.0",
    "requests>=2.28.0",
]
# All optional dependencies combined
all = [
    "torch>=2.0.0",
    "tensorflow>=2.12.0",
    "keras>=3.0.0",
    "scanpy>=1.9.0",
    "anndata>=0.9.0",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black",
    "ruff",
    "mypy>=1.0.0",
    "requests>=2.28.0",
]

[project.urls]
Homepage = "https://github.com/AkashKundu114/icc-clustering"
Repository = "https://github.com/AkashKundu114/icc-clustering.git"
Issues = "https://github.com/AkashKundu114/icc-clustering/issues"

[project.scripts]
icc = "icc.__main__:main"
icc-demo = "icc.__main__:main"
icc-run = "scripts.run:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = [
    "./data",
    ".pytest_cache",
    ".ruff_cache",
    ".mypy_cache",
]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E402"]

[tool.mypy]
python_version = "3.10"
mypy_path = "src"
ignore_missing_imports = true
warn_unused_configs = true

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --cov=src"
testpaths = [
    "tests",
]
pythonpath = [
    ".",
    "src",
]
markers = [
    "unit: Fast mathematical and algorithmic unit tests",
    "integration: Multi-model benchmarks, dataset loading, and scalability sweeps",
    "regression: Regression, fidelity, and theoretical boundary verification",
]
filterwarnings = [
    "ignore::sklearn.exceptions.ConvergenceWarning",
    "ignore:Graph is not fully connected:UserWarning",
    "ignore:`beta` is not used by ICC-v2:DeprecationWarning",
]
