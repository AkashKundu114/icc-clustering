[build-system]
requires = ["setuptools>=84.2.0"]
build-backend = "setuptools.build_meta"

[project]
name = "icc"
version = "2.1.0"
description = "Reference implementation: When Does Feature Gating and Anchor Consensus Improve High-Dimensional Clustering? An Empirical Examination"
readme = "README.md"
authors = [
    {name = "Akash Kundu", email = "akash231001001449@technoindiaeducation.com"}
]
license = {text = "MIT"}
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26.4",
    "scipy>=1.15.3",
    "pandas>=2.3.3",
    "matplotlib>=3.10.9",
    "scikit-learn>=1.7.2",
    "seaborn>=0.13.2",
    "pyyaml>=6.0.3",
    "tqdm>=4.70.1",
    "tabulate>=0.10.0",
    "reportlab>=4.5.1",
    "Pillow>=9.5.0",
]

[project.optional-dependencies]
# Deep clustering baselines (DEC, IDEC, SCAN, Contrastive Clustering)
deep = [
    "torch>=2.14.1",
    "tensorflow>=2.21.0",
    "keras>=3.12.4",
]
# Single-cell RNA-seq datasets and processing
bio = [
    "scanpy>=1.11.5",
    "anndata>=0.11.4",
]
# Development, testing, and linting
dev = [
    "pytest>=7.4.4",
    "pytest-cov>=4.1.0",
    "black",
    "ruff",
    "mypy>=1.20.2",
    "pymupdf>=1.28.2",
]
# All optional dependencies combined
all = [
    "torch>=2.14.1",
    "tensorflow>=2.21.0",
    "keras>=3.12.4",
    "scanpy>=1.11.5",
    "anndata>=0.11.4",
    "pytest>=7.4.4",
    "pytest-cov>=4.1.0",
    "black",
    "ruff",
    "mypy>=1.20.2",
    "pymupdf>=1.28.2",
]

[project.urls]
Homepage = "https://github.com/AkashKundu114/icc-clustering"
Repository = "https://github.com/AkashKundu114/icc-clustering.git"
Issues = "https://github.com/AkashKundu114/icc-clustering/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = [
    "archives",
    "data",
    "ieee_manuscript",
    ".pytest_cache",
    ".ruff_cache",
    ".mypy_cache",
]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
mypy_path = "src"
ignore_missing_imports = true
warn_unused_configs = true

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --cov=src"
testpaths = [
    "tests",
]
