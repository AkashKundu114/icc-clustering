[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "icc"
version = "2.0.0"
description = "Invariant Core Consensus: Geometry-Calibrated Ensemble Distillation for High-Dimensional Noise Regimes"
readme = "README.md"
authors = [
    {name = "Akash Kundu", email = "akash231001001449@technoindiaeducation.com"}
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.23.0",
    "scipy>=1.10.0",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
    "scikit-learn>=1.3.0",
    "seaborn>=0.12.0",
    "pyyaml>=6.0",
    "tqdm>=4.60.0",
    "tabulate>=0.9.0",
    "reportlab>=4.0.0",
    "Pillow>=9.5.0",
]

[project.optional-dependencies]
# Deep clustering baselines (DEC, IDEC, SCAN, Contrastive Clustering)
deep = [
    "torch>=2.0.0",
    "tensorflow>=2.12.0",
    "keras>=3.0.0",
]
# Single-cell RNA-seq datasets and processing
bio = [
    "scanpy>=1.9.0",
    "anndata>=0.9.0",
]
# Development, testing, and linting
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black",
    "ruff",
]
# All optional dependencies combined
all = [
    "torch>=2.0.0",
    "tensorflow>=2.12.0",
    "keras>=3.0.0",
    "scanpy>=1.9.0",
    "anndata>=0.9.0",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = [
    "archives",
    "data",
    "ieee_manuscript",
    ".pytest_cache",
    ".ruff_cache",
]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --cov=src"
testpaths = [
    "tests",
]
