name: ICC CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Test Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Package and Core Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Code Quality & Static Typing
        run: |
          python -m ruff check src/
          python -m mypy -p icc

      - name: Run Pytest Test Suite
        run: |
          python -m pytest tests -v --cov=src/icc

      - name: Run Interactive Demo Walkthrough
        run: |
          python demo.py

      - name: Run IEEE Manuscript Compliance Check (if present)
        if: hashFiles('ieee_manuscript/scripts/analyze_ieee_compliance.py') != ''
        run: |
          python ieee_manuscript/scripts/analyze_ieee_compliance.py
