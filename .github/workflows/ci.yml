name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  VECLIB_MAXIMUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"

jobs:
  test:
    name: Test Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Core Package and Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[dev]"

      - name: Code Quality & Static Linting (Ruff)
        run: |
          python -m ruff check .

      - name: Static Type Checking (Mypy)
        run: |
          python -m mypy -p icc

      - name: Automated Scientific Consistency Checker
        run: |
          python tools/check_consistency.py

      - name: Theoretical Determinacy Identities & Invariants
        run: |
          python scripts/reproduce.py --scope verify

      - name: Run Pytest Test Suite
        run: |
          python -m pytest tests/ -v

      - name: Run Push-Button Smoke Reproduction (< 3s)
        run: |
          python scripts/reproduce.py --scope smoke

      - name: Run Paper Tables Reproduction (~2s)
        run: |
          python scripts/reproduce.py --scope tables

      - name: Run Interactive Demo Walkthrough
        run: |
          python demo.py
