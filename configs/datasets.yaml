    name: "sonar"
    domain: "acoustic"
    source: "openml"
    openml_id: 40
    openml_name: "sonar"
    openml_version: 1
    expected_N: 208
    expected_D: 60
    expected_K: 2
    d_over_n_ratio: 0.29
    preprocessing:
      standardize: true
      impute_nan: true
      log_transform: false
      hvg_filter: false
    priority: "medium"
    enabled: true
    description: "Sonar acoustic returns (mines vs rocks)"

  madelon:
