# ==============================================================================
# ICC Benchmark Dataset Registry
# Contains loading configurations, dimensionality metadata, and preprocessing flags.
# ==============================================================================

defaults:
  cache_dir: "data/cache"
  raw_dir: "data/raw"
  preprocessing:
    standardize: true
    impute_nan: true
    log_transform: false
    hvg_filter: false

datasets:
