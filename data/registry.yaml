# ==============================================================================
# Unified Dataset Provenance & Preprocessing Registry (data/registry.yaml)
# Single Source of Truth for all 13 Benchmark Datasets in Paper 1 (ICC-v2)
# ==============================================================================

version: "2.1.0"
updated_at: "2026-10-29"
curator: "Akash Kundu (Techno India University)"
license_policy: "Public academic benchmark datasets under CC-BY / OpenML / Public Domain"

preprocessing_pipeline_default:
  imputation: "SimpleImputer(strategy='mean')"
  scaling: "StandardScaler(with_mean=True, with_std=True)"
  label_encoding: "LabelEncoder() mapping discrete classes to [0, K-1]"
  feature_filtering: "None (filtering handled exclusively by unsupervised algorithms under test)"

datasets:
  # ----------------------------------------------------------------------------
  # Category 1: Oncology Microarray Cohorts (D/N > 20)
  # ----------------------------------------------------------------------------
  cns:
    name: "Central Nervous System Embryonal Tumors (CNS)"
    domain: "Oncology Microarray"
    upstream_source: "OpenML"
    upstream_id: 45086
    upstream_url: "https://www.openml.org/d/45086"
    retrieval_date: "2026-10-20"
    license: "Public Domain / Open Access"
    n_samples: 60
    n_features: 7129
    n_clusters: 2
    d_over_n: 118.82
    class_balance: [21, 39]
    class_labels: ["survivor", "failure"]
    subsampling: null
    missing_values: 0
    preprocessing:
      imputation: "None required (0 missing)"
      standardization: "StandardScaler()"
    notes: "High-D distractor noise regime. Originates from Pomeroy et al. (Nature 2002)."

  colon:
    name: "Colon Cancer Gene Expression"
    domain: "Oncology Microarray"
    upstream_source: "OpenML"
    upstream_id: 45087
    upstream_url: "https://www.openml.org/d/45087"
