    class_labels: "Letters A through Z (26 classes)"
    subsampling: null
    missing_values: 0
    preprocessing:
      imputation: "None required"
      standardization: "StandardScaler()"
    notes: "Large-K benchmark (K=26) evaluating anchor scaling and class overlap."

  zheng68k:
    name: "Zheng PBMC 68k Single-Cell RNA-seq (Reduced)"
    domain: "Single-Cell Transcriptomics"
    upstream_source: "10x Genomics via Scanpy"
