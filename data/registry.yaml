    n_features: 2000
    n_clusters: 2
    d_over_n: 32.26
    class_balance: [40, 22]
    class_labels: ["tumor", "normal"]
    subsampling: null
    missing_values: 0
    preprocessing:
      imputation: "None required (0 missing)"
      standardization: "StandardScaler()"
    notes: "Alon et al. (PNAS 1999) Affymetrix oligonucleotide array."

  leukemia:
