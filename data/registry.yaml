    d_over_n: 59.90
    class_balance: [91, 162]
    class_labels: ["normal", "cancer"]
    subsampling: null
    missing_values: 0
    preprocessing:
      imputation: "None required (0 missing)"
      standardization: "StandardScaler()"
    notes: "Petricoin et al. (Lancet 2002) ultra-high-dimensional SELDI-TOF proteomic spectra."

  prostate:
    name: "Prostate Cancer Microarray"
    domain: "Oncology Microarray"
