    upstream_url: "https://www.openml.org/d/1104"
    retrieval_date: "2026-10-20"
    license: "Public Domain / Open Access"
    n_samples: 72
    n_features: 7129
    n_clusters: 2
    d_over_n: 99.01
    class_balance: [47, 25]
    class_labels: ["ALL", "AML"]
    subsampling: null
    missing_values: 0
    preprocessing:
      imputation: "None required (0 missing)"
      standardization: "StandardScaler()"
    notes: "Benchmark from Golub et al. (Science 1999). 50 verified clinical diagnostic markers."

  ovarian:
