    class_balance: [50, 52]
    class_labels: ["normal", "tumor"]
    subsampling: null
    missing_values: 0
    preprocessing:
      imputation: "None required (0 missing)"
      standardization: "StandardScaler()"
    notes: "Singh et al. (Cancer Cell 2002). Extreme high-D noise with subtle transcriptional signal."

  srbct:
    name: "Small Round Blue Cell Tumors"
    domain: "Oncology Microarray"
