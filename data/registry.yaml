    n_features: 765
    n_clusters: 10
    d_over_n: 1.09
    class_balance: "10 immune cell subtypes (CD4+, CD8+, B-cells, NK, Monocytes, Dendritic)"
    class_labels: "Classes 0 through 9 (10 immune cell types)"
    subsampling: "Standard 700-cell reduced cohort from Scanpy benchmark."
    missing_values: 0
    preprocessing:
      imputation: "None required"
      log_transform: "log1p(count) normalization"
      standardization: "StandardScaler()"
    notes: "Extreme zero-inflation (>85% zeros) testing hurdle dropout limitations."

  # ----------------------------------------------------------------------------
  # Category 3: Text, Hyperspectral, and Computer Vision Cohorts
  # ----------------------------------------------------------------------------
  newsgroups20:
    name: "20 Newsgroups (CMU)"
    domain: "Text Document TF-IDF"
    upstream_source: "Scikit-Learn (CMU / Lang 1995)"
    upstream_id: "sklearn.datasets.fetch_20newsgroups"
    upstream_url: "http://qwone.com/~jason/20Newsgroups/"
    retrieval_date: "2026-10-20"
    license: "Public Domain"
    n_samples: 18846
    n_features: 10000
    n_clusters: 20
    d_over_n: 0.53
    class_balance: "20 topic newsgroups (~900-1000 documents per group)"
    class_labels: "20 newsgroup topics (alt.atheism to talk.religion.misc)"
    subsampling: null
    missing_values: 0
    preprocessing:
      vectorizer: "TfidfVectorizer(max_features=10000, stop_words='english', norm='l2')"
      standardization: "None (preserves sparse TF-IDF unit norm)"
    notes: "High-dimensional sparse bag-of-words text clustering."

  indian_pines:
    name: "Indian Pines Hyperspectral Flight Line"
    domain: "Hyperspectral Remote Sensing"
    upstream_source: "Universidad del País Vasco (UPV/EHU)"
    upstream_id: "Indian_pines_corrected.mat"
    upstream_url: "https://www.ehu.eus/ccwintco/uploads/6/67/Indian_pines_corrected.mat"
    retrieval_date: "2026-10-20"
