    retrieval_date: "2026-10-20"
    license: "Public Domain / UCI"
    n_samples: 208
    n_features: 60
    n_clusters: 2
    d_over_n: 0.29
    class_balance: [97, 111]
    class_labels: ["mine", "rock"]
    subsampling: null
    missing_values: 0
    preprocessing:
      imputation: "None required (0 missing)"
      standardization: "StandardScaler()"
    notes: "Gorman & Sejnowski (1988) dense continuous baseline control."

  madelon:
