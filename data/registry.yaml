    class_labels: "16 agricultural land-cover classes (Alfalfa to Stone-steel towers)"
    subsampling: "Excludes unlabelled background pixels (label 0), retaining 10,249 valid pixels."
    missing_values: 0
    preprocessing:
      imputation: "None required"
      standardization: "StandardScaler()"
    notes: "Continuous spectral radiance bands across 0.4-2.5 um."

  yale_b:
