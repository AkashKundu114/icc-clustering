# ==============================================================================
# ICC Benchmark Dataset Registry (Unified Single Source of Truth)
# All D/N ratios computed programmatically: D_over_N = round(D / N, 2)
# ==============================================================================

metadata:
  version: "2.0.0"
  description: "Standardized benchmark registry for Inductive Consensus Clustering"
  default_preprocessing:
    impute_nan: true
    standardize: true
    log_transform: false
    label_encoding: true

datasets:
  # ----------------------------------------------------------------------------
  # Core High-Dimensional Cancer Microarrays & Mass Spectrometry (D/N > 20)
  # ----------------------------------------------------------------------------
  colon:
    name: "colon"
    domain: "genomics"
    N: 62
    D: 2000
    K: 2
    d_over_n: 32.26
    source: "OpenML (ID: 1111)"
    url: "https://www.openml.org/d/1111"
    license: "Public Domain / CC0"
    is_sparse: false
    preprocessing: "mean_imputation, standard_scaler, label_encoder"
    description: "Colon cancer gene expression microarray (tumor vs normal)"

  srbct:
    name: "srbct"
    domain: "genomics"
    N: 83
